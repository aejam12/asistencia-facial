<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-3 select-none">

  <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-2xl w-full max-w-xs space-y-3 text-center">
    
    <!-- Encabezado Popup -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-2">
      <span class="text-xs font-bold text-emerald-400"><i class="fa-solid fa-camera mr-1"></i> Escáner Facial</span>
      <span id="tipo-marcaje" class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full font-bold"></span>
    </div>

    <!-- Visor de Vídeo -->
    <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden border border-slate-700">
      <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <canvas id="canvas" class="hidden"></canvas>
    </div>

    <!-- Botón Captura y Cierre -->
    <button onclick="capturarEnviarYCerrar()" id="btn-captura" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-white shadow-lg text-xs transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-circle-dot"></i>
      <span>Tomar Foto y Registrar</span>
    </button>

    <p id="msg-estado" class="text-[10px] text-slate-400"></p>

  </div>

  <script>
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxuEaDFJTSA2w__q7cPnuyyU26CvOoJQbSayf96MAm6m-30_-BMQCaueWtG9TUNDh3rZw/exec";

    const video = document.getElementById('webcam');
    const urlParams = new URLSearchParams(window.location.search);
    const accion = urlParams.get('accion') || 'Entrada';
    document.getElementById('tipo-marcaje').innerText = accion;

    async function iniciarCamara() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } }, 
          audio: false 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Error de cámara: " + err.message);
      }
    }

    async function capturarEnviarYCerrar() {
      if (!video.srcObject) return alert("Cámara no lista.");

      const btn = document.getElementById('btn-captura');
      const msg = document.getElementById('msg-estado');

      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 480;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const fotoBase64 = canvas.toDataURL('image/jpeg');

      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Guardando...`;
      btn.disabled = true;
      msg.innerText = "Registrando y cerrando ventana...";

      try {
        await fetch(URL_WEB_APP, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ accion: accion, fotoBase64: fotoBase64 })
        });

        if (window.opener) {
          window.opener.postMessage({ status: 'completado', accion: accion }, '*');
        }

        const stream = video.srcObject;
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        setTimeout(() => {
          window.close(); // Cierra el Popup flotante
        }, 300);

      } catch (err) {
        alert("Error al guardar: " + err.message);
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-circle-dot"></i> <span>Tomar Foto y Registrar</span>`;
      }
    }

    window.onload = iniciarCamara;
  </script>
</body>
</html>
